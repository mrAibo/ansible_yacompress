---
- name: Smoke-test multi_archive through Ansible
  hosts: localhost
  gather_facts: false
  vars:
    test_root: "{{ playbook_dir }}/test_data"
    source_dir: "{{ test_root }}/source"
    archive_path: "{{ test_root }}/archives/source.tar.gz"

  tasks:
    - name: Run smoke test with guaranteed cleanup
      block:
        - name: Prepare source data
          ansible.builtin.shell:
            cmd: |
              set -eu
              mkdir -p {{ source_dir | quote }}/subdir {{ test_root | quote }}/archives
              printf '%s\n' 'one' > {{ source_dir | quote }}/one.txt
              printf '%s\n' 'two' > {{ source_dir | quote }}/subdir/two.txt
          changed_when: true

        - name: Predict archive creation without touching the filesystem
          multi_archive:
            source: "{{ source_dir }}"
            dest: "{{ test_root }}/check-only/source.tar.gz"
            state: archived
          check_mode: true
          register: check_result

        - name: Verify check mode made no filesystem changes
          ansible.builtin.shell:
            cmd: |
              set -eu
              test "{{ check_result.changed | lower }}" = true
              test ! -e {{ test_root | quote }}/check-only
          changed_when: false

        - name: Create archive through the custom module
          multi_archive:
            source: "{{ source_dir }}"
            dest: "{{ archive_path }}"
            state: archived
            compression: auto
          register: archive_result

        - name: Verify archive result and members
          ansible.builtin.shell:
            cmd: |
              set -eu
              test "{{ archive_result.changed | lower }}" = true
              test "{{ archive_result.format_detected }}" = tar.gz
              tar -tzf {{ archive_path | quote }} | grep -Fx source/one.txt
              tar -tzf {{ archive_path | quote }} | grep -Fx source/subdir/two.txt
          changed_when: false

      always:
        - name: Remove smoke-test data
          ansible.builtin.file:
            path: "{{ test_root }}"
            state: absent
          changed_when: false
