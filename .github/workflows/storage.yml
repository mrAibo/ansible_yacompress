name: Enterprise storage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-sparse-and-atomic-replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install test requirements
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq python3-venv tar gzip pigz bzip2 xz-utils zstd zip unzip >/dev/null

      - name: Run sparse unit tests
        run: python3 tests/test_sparse.py

      - name: Validate host script with an inherited collection path
        run: |
          rm -rf /dev/shm/yacompress-storage /tmp/yacompress-inherited-collections
          mkdir -p /dev/shm/yacompress-storage /tmp/yacompress-inherited-collections
          ANSIBLE_COLLECTIONS_PATH=/tmp/yacompress-inherited-collections \
          ./tests/run_host_storage_validation.sh /dev/shm/yacompress-storage \
            > /tmp/yacompress-host-validation.log 2>&1

      - name: Upload host validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-validation-log
          path: /tmp/yacompress-host-validation.log
          if-no-files-found: error
