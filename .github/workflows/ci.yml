name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pigz zip unzip bzip2 xz-utils zstd
          python3 -m pip install --disable-pip-version-check -q ansible-core
      - name: Compile
        run: python3 -m py_compile plugins/modules/multi_archive.py tests/test_multi_archive.py tests/test_failure_paths.py tests/test_formats_performance.py tests/test_multiple_sources.py
      - name: Behavior tests
        run: python3 tests/test_multi_archive.py
      - name: Failure-path tests
        run: python3 tests/test_failure_paths.py
      - name: Format and performance tests
        run: python3 tests/test_formats_performance.py
      - name: Multiple-source tests
        run: python3 tests/test_multiple_sources.py
      - name: Legacy module documentation
        run: ANSIBLE_LIBRARY=. ansible-doc -t module multi_archive >/dev/null
      - name: Legacy Ansible smoke test
        run: ANSIBLE_LIBRARY=. ANSIBLE_NOCOLOR=1 ansible-playbook -i localhost, -c local tests.yml
      - name: Build and install collection
        run: |
          mkdir -p build collections
          ansible-galaxy collection build --output-path build
          ansible-galaxy collection install build/mraibo-yacompress-1.4.0.tar.gz -p collections
      - name: Collection documentation
        run: ANSIBLE_COLLECTIONS_PATH="$PWD/collections" ansible-doc mraibo.yacompress.multi_archive >/dev/null
      - name: Collection smoke test
        run: ANSIBLE_COLLECTIONS_PATH="$PWD/collections" ANSIBLE_NOCOLOR=1 ansible-playbook -i localhost, -c local tests/collection_smoke.yml

  ansible-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pigz zip unzip bzip2 xz-utils zstd
          python3 -m pip install --disable-pip-version-check -q ansible-core
      - name: Prepare physical collection layout
        run: |
          mkdir -p /tmp/ansible_collections/mraibo/yacompress
          cp -a "$GITHUB_WORKSPACE/." /tmp/ansible_collections/mraibo/yacompress/
      - name: Official ansible-test sanity
        working-directory: /tmp/ansible_collections/mraibo/yacompress
        shell: bash
        run: |
          set -o pipefail
          ansible-test sanity --python 3.12 2>&1 | tee "$GITHUB_WORKSPACE/sanity.log"
      - name: Upload sanity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-diagnostics
          path: sanity.log
      - name: Official ansible-test integration
        working-directory: /tmp/ansible_collections/mraibo/yacompress
        run: ansible-test integration --python 3.12 multi_archive
