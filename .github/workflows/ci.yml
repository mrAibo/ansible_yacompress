name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pigz zip unzip bzip2 xz-utils zstd
          python3 -m pip install --disable-pip-version-check ansible-core
      - name: Compile
        run: python3 -m py_compile multi_archive.py tests/test_multi_archive.py tests/test_failure_paths.py tests/test_formats_performance.py
      - name: Behavior tests
        run: python3 tests/test_multi_archive.py
      - name: Failure-path tests
        run: python3 tests/test_failure_paths.py
      - name: Format and performance tests
        run: python3 tests/test_formats_performance.py
      - name: Module documentation
        run: ANSIBLE_LIBRARY=. ansible-doc -t module multi_archive >/dev/null
      - name: Ansible smoke test
        run: ANSIBLE_LIBRARY=. ANSIBLE_NOCOLOR=1 ansible-playbook -i localhost, -c local tests.yml
