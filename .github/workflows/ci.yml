name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pigz zip unzip bzip2 xz-utils zstd
          python3 -m pip install --disable-pip-version-check -q ansible-core
      - name: Compile
        run: python3 -m py_compile plugins/modules/multi_archive.py plugins/modules/archive_verify.py plugins/modules/archive_rotate.py plugins/modules/archive_manifest.py scripts/release.py tests/test_multi_archive.py tests/test_failure_paths.py tests/test_formats_performance.py tests/test_multiple_sources.py tests/test_sparse.py tests/test_release.py tests/test_archive_verify.py tests/test_archive_rotate.py tests/test_archive_manifest.py
      - name: Behavior tests
        run: python3 tests/test_multi_archive.py
      - name: Failure-path tests
        run: python3 tests/test_failure_paths.py
      - name: Format and performance tests
        run: python3 tests/test_formats_performance.py
      - name: Multiple-source tests
        run: python3 tests/test_multiple_sources.py
      - name: Sparse-file tests
        run: python3 tests/test_sparse.py
      - name: Archive verification tests
        run: python3 tests/test_archive_verify.py
      - name: Archive rotation tests
        run: python3 tests/test_archive_rotate.py
      - name: Archive manifest tests
        run: python3 tests/test_archive_manifest.py
      - name: Release metadata tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_release.py
          version="$(python3 -c "from pathlib import Path; from scripts.release import read_collection_version; print(read_collection_version(Path('galaxy.yml')))")"
          python3 scripts/release.py "v$version" --notes-output /tmp/release-notes.md
          test -s /tmp/release-notes.md
      - name: Legacy module documentation
        run: ANSIBLE_LIBRARY=. ansible-doc -t module multi_archive >/dev/null
      - name: Legacy Ansible smoke test
        run: ANSIBLE_LIBRARY=. ANSIBLE_NOCOLOR=1 ansible-playbook -i localhost, -c local tests.yml
      - name: Build and install collection
        run: |
          mkdir -p build collections
          ansible-galaxy collection build --output-path build
          archive=$(find build -maxdepth 1 -name 'mraibo-yacompress-*.tar.gz' -print -quit)
          test -n "$archive"
          ansible-galaxy collection install "$archive" -p collections
      - name: Collection documentation
        run: |
          ANSIBLE_COLLECTIONS_PATH="$PWD/collections" ansible-doc mraibo.yacompress.multi_archive >/dev/null
          ANSIBLE_COLLECTIONS_PATH="$PWD/collections" ansible-doc mraibo.yacompress.archive_verify >/dev/null
          ANSIBLE_COLLECTIONS_PATH="$PWD/collections" ansible-doc mraibo.yacompress.archive_rotate >/dev/null
          ANSIBLE_COLLECTIONS_PATH="$PWD/collections" ansible-doc mraibo.yacompress.archive_manifest >/dev/null
      - name: Collection smoke test
        run: ANSIBLE_COLLECTIONS_PATH="$PWD/collections" ANSIBLE_NOCOLOR=1 ansible-playbook -i localhost, -c local tests/collection_smoke.yml

  ansible-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pigz zip unzip bzip2 xz-utils zstd rsync
          python3 -m pip install --disable-pip-version-check -q ansible-core
      - name: Prepare physical collection layout
        run: |
          mkdir -p /tmp/ansible_collections/mraibo/yacompress
          rsync -a \
            --exclude .git \
            --exclude build \
            --exclude collections \
            --exclude sanity.log \
            "$GITHUB_WORKSPACE/" /tmp/ansible_collections/mraibo/yacompress/
      - name: Official ansible-test sanity
        working-directory: /tmp/ansible_collections/mraibo/yacompress
        shell: bash
        run: |
          set -o pipefail
          ansible-test sanity --python 3.12 2>&1 | tee "$GITHUB_WORKSPACE/sanity.log"
      - name: Upload sanity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-diagnostics
          path: sanity.log
      - name: Official ansible-test integration
        working-directory: /tmp/ansible_collections/mraibo/yacompress
        run: ansible-test integration --python 3.12 multi_archive archive_verify archive_rotate archive_manifest
