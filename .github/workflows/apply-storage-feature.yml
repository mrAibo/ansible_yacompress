name: Apply storage feature

on:
  push:
    branches:
      - agent/enterprise-storage-validation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enterprise-storage-validation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add sparse archive support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('plugins/modules/multi_archive.py')
          text = path.read_text()

          replacements = [
              (
                  "  verify_archive:\n    description: Verify the completed archive before replacing the destination.\n    type: bool\n    default: false\n",
                  "  verify_archive:\n    description: Verify the completed archive before replacing the destination.\n    type: bool\n    default: false\n  sparse:\n    description:\n      - Enable GNU tar sparse-file detection while creating TAR-family archives.\n      - Useful for virtual disk images, database files, and other files with holes.\n    type: bool\n    default: false\n",
              ),
              (
                  "threads_used:\n  description: Thread setting applied to the selected compressor.\n  type: raw\n  returned: state=archived\n",
                  "threads_used:\n  description: Thread setting applied to the selected compressor.\n  type: raw\n  returned: state=archived\nsparse_used:\n  description: Whether GNU tar sparse-file detection was enabled.\n  type: bool\n  returned: state=archived\n",
              ),
              (
                  "def _build_archive_command(module, source, dest, fmt, compression, include, exclude,\n                           compression_level=None, threads='auto'):\n",
                  "def _build_archive_command(module, source, dest, fmt, compression, include, exclude,\n                           compression_level=None, threads='auto', sparse=False):\n",
              ),
              (
                  "        cmd = [tar] + comp + ['-cf', dest]\n        for pattern in exclude:\n",
                  "        cmd = [tar] + comp + ['-cf', dest]\n        if sparse:\n            cmd.append('--sparse')\n        for pattern in exclude:\n",
              ),
              (
                  "def _temporary_archive(parent, fmt):\n",
                  "def _validate_sparse(module, state, fmt, sparse):\n    if not sparse:\n        return\n    if state != 'archived':\n        module.fail_json(msg=\"sparse applies only when state=archived\")\n    if fmt == 'zip':\n        module.fail_json(msg=\"sparse is supported only for TAR-family formats\")\n\n\ndef _temporary_archive(parent, fmt):\n",
              ),
              (
                  "        level, threads,\n    )\n",
                  "        level, threads, params.get('sparse', False),\n    )\n",
              ),
              (
                  "            compression_level_used=level, format_detected=params['format_detected'],\n",
                  "            compression_level_used=level, sparse_used=params.get('sparse', False),\n            format_detected=params['format_detected'],\n",
              ),
              (
                  "        'compression_level_used': level, 'format_detected': params['format_detected'],\n",
                  "        'compression_level_used': level, 'sparse_used': params.get('sparse', False),\n        'format_detected': params['format_detected'],\n",
              ),
              (
                  "            'verify_archive': {'type': 'bool', 'default': False},\n",
                  "            'verify_archive': {'type': 'bool', 'default': False},\n            'sparse': {'type': 'bool', 'default': False},\n",
              ),
              (
                  "    params['format_detected'] = params['format'] if detected else None\n    _validate(\n",
                  "    params['format_detected'] = params['format'] if detected else None\n    _validate_sparse(module, params['state'], params['format'], params['sparse'])\n    _validate(\n",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('expected module block not found: %r' % old[:80])
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          cat > tests/test_sparse.py <<'PY'
          import importlib.util
          import sys
          import types
          import unittest
          from pathlib import Path

          ansible = types.ModuleType('ansible')
          module_utils = types.ModuleType('ansible.module_utils')
          basic = types.ModuleType('ansible.module_utils.basic')
          basic.AnsibleModule = object
          sys.modules['ansible'] = ansible
          sys.modules['ansible.module_utils'] = module_utils
          sys.modules['ansible.module_utils.basic'] = basic

          module_path = Path(__file__).resolve().parents[1] / 'multi_archive.py'
          spec = importlib.util.spec_from_file_location('multi_archive_sparse', str(module_path))
          multi_archive = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(multi_archive)


          class FailJson(RuntimeError):
              pass


          class FakeModule:
              def get_bin_path(self, name, required=False):
                  return '/usr/bin/' + name

              def fail_json(self, **kwargs):
                  raise FailJson(kwargs['msg'])


          class SparseTests(unittest.TestCase):
              def setUp(self):
                  self.module = FakeModule()

              def test_tar_command_enables_sparse_detection(self):
                  command, used, threads, cwd = multi_archive._build_archive_command(
                      self.module, '/tmp/disk.img', '/tmp/disk.tar.zst', 'tar.zst',
                      'none', [], [], 1, 1, True,
                  )
                  self.assertIn('--sparse', command)
                  self.assertEqual(used, 'zstd')
                  self.assertIsNone(cwd)

              def test_zip_rejects_sparse_mode(self):
                  with self.assertRaisesRegex(FailJson, 'TAR-family'):
                      multi_archive._validate_sparse(self.module, 'archived', 'zip', True)

              def test_unarchive_rejects_sparse_mode(self):
                  with self.assertRaisesRegex(FailJson, 'state=archived'):
                      multi_archive._validate_sparse(self.module, 'unarchived', 'tar.zst', True)


          if __name__ == '__main__':
              unittest.main(verbosity=2)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins/modules/multi_archive.py tests/test_sparse.py
          git commit -m 'Add sparse TAR archive support'
          git push origin HEAD:agent/enterprise-storage-validation
