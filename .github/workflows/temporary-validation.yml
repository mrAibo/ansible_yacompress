name: Temporary destructive-path validation

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pigz zip unzip bzip2
          python3 -m pip install --disable-pip-version-check ansible-core

      - name: Run all tests
        run: |
          python3 -m py_compile multi_archive.py tests/test_multi_archive.py tests/test_failure_paths.py
          python3 tests/test_multi_archive.py
          python3 tests/test_failure_paths.py
          ANSIBLE_LIBRARY=. ansible-doc -t module multi_archive >/dev/null
          ANSIBLE_LIBRARY=. ANSIBLE_NOCOLOR=1 ansible-playbook -i localhost, -c local tests.yml
