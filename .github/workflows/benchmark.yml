name: Archive benchmark

on:
  pull_request:
    paths:
      - benchmarks/**
      - .github/workflows/benchmark.yml
  workflow_dispatch:
    inputs:
      size_mib:
        description: Size of the large compressible dataset in MiB
        required: true
        default: "128"
      small_files:
        description: Number of files in the metadata-heavy dataset
        required: true
        default: "5000"
      iterations:
        description: Measured iterations per case and dataset
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIZE_MIB: ${{ github.event_name == 'workflow_dispatch' && inputs.size_mib || '2' }}
      SMALL_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.small_files || '50' }}
      ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.iterations || '1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native tools and Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pigz zip unzip bzip2 xz-utils zstd
          python3 -m pip install --disable-pip-version-check -q ansible-core

      - name: Install benchmark collections
        run: |
          mkdir -p build collections
          ansible-galaxy collection build --output-path build
          archive=$(find build -maxdepth 1 -name 'mraibo-yacompress-*.tar.gz' -print -quit)
          test -n "$archive"
          ansible-galaxy collection install "$archive" -p collections
          ansible-galaxy collection install community.general -p collections

      - name: Run benchmark
        shell: bash
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_NOCOLOR: "1"
        run: |
          set -o pipefail
          python3 benchmarks/run.py \
            --size-mib "$SIZE_MIB" \
            --small-files "$SMALL_FILES" \
            --iterations "$ITERATIONS" \
            2>&1 | tee benchmark.log

      - name: Show summary
        if: success()
        run: cat benchmark-results/results.md

      - name: Upload benchmark results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-benchmark-${{ github.run_id }}
          path: |
            benchmark-results/
            benchmark.log
