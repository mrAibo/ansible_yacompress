name: Apply portable tar read fix

on:
  push:
    branches:
      - agent/enterprise-compatibility

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enterprise-compatibility
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('plugins/modules/multi_archive.py')
          text = path.read_text()
          old_unarchive = '''def _unarchive_command(module, source, dest, fmt):
              if fmt == 'zip':
                  return [module.get_bin_path('unzip', required=True), '-o', source, '-d', dest]
              tar = module.get_bin_path('tar', required=True)
              if fmt != 'tar':
                  compressor = {'tar.gz': 'gzip', 'tar.bz2': 'bzip2', 'tar.xz': 'xz', 'tar.zst': 'zstd'}[fmt]
                  module.get_bin_path(compressor, required=True)
              return [tar, '-xf', source, '-C', dest]
          '''
          new_unarchive = '''def _tar_read_options(module, fmt):
              if fmt == 'tar':
                  return []
              compressor = {
                  'tar.gz': 'gzip', 'tar.bz2': 'bzip2',
                  'tar.xz': 'xz', 'tar.zst': 'zstd',
              }[fmt]
              return ['-I', module.get_bin_path(compressor, required=True)]


          def _unarchive_command(module, source, dest, fmt):
              if fmt == 'zip':
                  return [module.get_bin_path('unzip', required=True), '-o', source, '-d', dest]
              tar = module.get_bin_path('tar', required=True)
              return [tar] + _tar_read_options(module, fmt) + ['-xf', source, '-C', dest]
          '''
          old_verify = '''def _verify_archive(module, path, fmt, compression_used=None):
              if fmt == 'zip':
                  _run(module, [module.get_bin_path('unzip', required=True), '-tqq', path])
              else:
                  _run(module, [module.get_bin_path('tar', required=True), '-tf', path])
          '''
          new_verify = '''def _verify_archive(module, path, fmt, compression_used=None):
              if fmt == 'zip':
                  _run(module, [module.get_bin_path('unzip', required=True), '-tqq', path])
              else:
                  command = [module.get_bin_path('tar', required=True)]
                  command += _tar_read_options(module, fmt) + ['-tf', path]
                  _run(module, command)
          '''
          if old_unarchive not in text or old_verify not in text:
              raise SystemExit('expected module blocks not found')
          path.write_text(text.replace(old_unarchive, new_unarchive).replace(old_verify, new_verify))
          PY

          cat > tests/test_portable_tar_read.py <<'PY'
          import importlib.util
          import sys
          import types
          import unittest
          from pathlib import Path

          ansible = types.ModuleType('ansible')
          module_utils = types.ModuleType('ansible.module_utils')
          basic = types.ModuleType('ansible.module_utils.basic')
          basic.AnsibleModule = object
          sys.modules['ansible'] = ansible
          sys.modules['ansible.module_utils'] = module_utils
          sys.modules['ansible.module_utils.basic'] = basic

          module_path = Path(__file__).resolve().parents[1] / 'multi_archive.py'
          spec = importlib.util.spec_from_file_location('multi_archive_portable_read', str(module_path))
          multi_archive = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(multi_archive)


          class FakeModule:
              def get_bin_path(self, name, required=False):
                  return '/usr/bin/' + name


          class PortableTarReadTests(unittest.TestCase):
              def setUp(self):
                  self.module = FakeModule()

              def test_zstd_verification_uses_explicit_decompressor(self):
                  calls = []
                  original = multi_archive._run
                  multi_archive._run = lambda module, command, cwd=None: calls.append(command)
                  try:
                      multi_archive._verify_archive(self.module, '/tmp/data.tar.zst', 'tar.zst')
                  finally:
                      multi_archive._run = original
                  self.assertEqual(
                      calls[0],
                      ['/usr/bin/tar', '-I', '/usr/bin/zstd', '-tf', '/tmp/data.tar.zst'],
                  )

              def test_xz_extraction_uses_explicit_decompressor(self):
                  self.assertEqual(
                      multi_archive._unarchive_command(
                          self.module, '/tmp/data.tar.xz', '/tmp/out', 'tar.xz'
                      ),
                      ['/usr/bin/tar', '-I', '/usr/bin/xz', '-xf', '/tmp/data.tar.xz', '-C', '/tmp/out'],
                  )


          if __name__ == '__main__':
              unittest.main(verbosity=2)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plugins/modules/multi_archive.py tests/test_portable_tar_read.py
          git commit -m 'Use explicit decompressors for portable tar reads'
          git push origin HEAD:agent/enterprise-compatibility
