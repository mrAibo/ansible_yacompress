name: Apply exclude validation

on:
  push:
    branches:
      - agent/validate-excludes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply focused patch
        run: python3 tools/apply_exclude_validation.py
      - name: Remove temporary patch machinery
        run: |
          rm tools/apply_exclude_validation.py
          rm .github/workflows/apply-exclude-validation.yml
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Validate exclude patterns" || exit 0
          git push
